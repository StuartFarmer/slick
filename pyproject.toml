[tool.poetry]
name = "slick-ai"
version = "0.2.0"
description = "Prompts as typed Python functions, run on CLI-backed models."
authors = ["Stuart Farmer <stuart@lamden.io>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "slick" }]

[tool.poetry.dependencies]
python = "^3.10"
jinja2 = ">=3.1"
pydantic = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7"
ruff = ">=0.4"

[tool.poetry.scripts]
slick = "slick.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
